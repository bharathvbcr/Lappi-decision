[package]
name = "qd-mutate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Mutation engine: takes a clean function from a code pool and emits a labeled diff with an exact line span."

[lib]
name = "qd_mutate"
path = "src/lib.rs"

[[bin]]
name = "qd-mutate"
path = "src/main.rs"

# `code.defect_class` rows whose gold is `noul`: contexts that are not this model's kind (prose,
# scrambled code, languages the pool never held). Outside `src/bin/` so cargo's target
# auto-discovery does not claim the same file a second time.
[[bin]]
name = "qd-noul-rows"
path = "src/noul_rows/main.rs"

[dependencies]
# The language facts (LangId, the path map, the pool's languages), re-exported; a workspace crate.
qd-lang = { path = "../qd-lang" }
tree-sitter.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-go.workspace = true
tree-sitter-python.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-swift.workspace = true

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
rand.workspace = true
rand_chacha.workspace = true
sha2.workspace = true
thiserror.workspace = true
