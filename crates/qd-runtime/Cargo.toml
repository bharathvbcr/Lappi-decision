[package]
name = "qd-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The universal typed-decision interface: schema, refusal layer, slot-answering procedure, and the qd serve / qd oneshot modes."

[lib]
name = "qd_runtime"
path = "src/lib.rs"

[[bin]]
name = "qd"
path = "src/main.rs"

# A diagnostic over a scoring run's verdict files, built on `calibration::calibrate` so its
# margins are the runtime's own. It installs nothing the runtime reads.
[[bin]]
name = "qd-margin-probe"
path = "src/bin/qd_margin_probe.rs"

# Fits the calibration table from a scoring run's verdict files, through `calibration_fit` and
# `calibration::calibrate`, and writes it as `CalibrationTable`'s own bytes. It installs nothing:
# which fitted table ships is the human's call (CLAUDE.md rule 2).
[[bin]]
name = "qd-calib-fit"
path = "src/bin/qd_calib_fit.rs"

# No async runtime, no socket crate, no timer crate: `std::os::unix::net`,
# `Condvar::wait_timeout` and `set_read_timeout` cover the whole server.
# Adding one would be a new dependency for capability std already has.
[dependencies]
base64.workspace = true
# The admission check's language facts: the path map and the languages the pool held. A
# workspace crate whose only dependency is serde, so no grammar is linked into the runtime.
qd-lang = { path = "../qd-lang" }
serde.workspace = true
# `float_roundtrip` (no extra crate: the feature is `[]` in serde_json's manifest): the default
# parser is best-effort and read a fitted conformal cutoff back one ulp off (…b9d0 -> …b9d1), so a
# `CalibrationTable` loaded from the file `qd-calib-fit` wrote was not the fitted table and its
# `hash()` was not the file's sha256. `tests/calib_fit_roundtrip.rs` fails without it.
serde_json = { workspace = true, features = ["float_roundtrip"] }
clap.workspace = true
sha2.workspace = true
thiserror.workspace = true

# Nothing new: the integration tests build wire payloads and read replies back, which needs the
# same two crates the library already links. No test-only runtime, harness or fixture crate.
[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
