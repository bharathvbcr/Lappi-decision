[package]
name = "qd-prep"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "CPU-bound loops ported out of Python: MinHash signatures for the ft_splits rebuild, and the FT linear control's n-gram hashing and fit."

[lib]
name = "qd_prep"
path = "src/lib.rs"

[[bin]]
name = "qd-prep"
path = "src/main.rs"

# Nothing beyond what the workspace already declares, and nothing that links C: BLAKE2b is
# written out here (RFC 7693) because no blake2 crate is in [workspace.dependencies], and the
# threads are std::thread::scope. The binary is cross-built for the aarch64 box, which has no
# Rust toolchain, so every dependency added here is one more thing that has to cross-compile.
# serde_json (pure Rust, already in the lock) parses the decision sources for `decisions`.
[dependencies]
clap.workspace = true
serde_json.workspace = true
# A workspace crate (no C, serde only), not a new dependency: `natural-bugs` admits a file by
# the one owner of the path-to-language map, as the runtime's admission check does.
qd-lang = { path = "../qd-lang" }
