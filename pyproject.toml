[project]
name = "qwen-decision"
version = "0.1.0"
description = "A general typed decision model: context, a question, and a schema of slots."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

# Deliberately minimal. The heavy training stack (torch, transformers at a pinned
# main SHA, flash-linear-attention, causal-conv1d, vLLM) is CUDA-only and lives in
# the Lambda lockfile under `stack/`, NOT here: installing it on this Mac would
# resolve a CPU/MPS torch and produce a lockfile that does not describe the machine
# the training actually runs on.
dependencies = [
  "numpy>=1.26",
  "datasketch>=1.6",   # MinHash LSH for the 0.8-Jaccard dedupe
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# What the Mac can actually run: the depth probe, the text-only export, the toy
# smoke fine-tune, and the teacher rubric iteration.
mac = [
  "torch>=2.12",
  "transformers>=4.57",
  "safetensors>=0.4",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",  # property tests for the splitter and the prompt renderer
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/qd_data", "python/qd_train", "python/qd_wire"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]
# A test that reports "no tests ran" as success is exactly the failure mode S7
# exists to catch, so an empty collection is an error here.
addopts = "-q --strict-markers --strict-config"
markers = [
  "gpu: requires CUDA; reported as NOT RUN on this host, never as passed",
  "slow: over 10s",
  "network: reaches a dataset host; skipped offline and recorded as not_run",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# The packages live under `python/`, not at the repo root — the same fact
# `[tool.pytest.ini_options].pythonpath` and `[tool.hatch.build.targets.wheel]`
# already state. Without it ruff's isort resolves `qd_data`/`qd_train`/`qd_wire`/
# `qd_label` as third-party and merges them into the third-party block, so I001
# silently accepted 26 mis-grouped import blocks it should have flagged (3 found
# before this line, 29 after). A selected rule checking the wrong thing is the
# same defect as an unselected one.
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "PTH"]

# Records, not code to keep tidy: these three are evidence of what ran, so their bytes stay as
# they ran. A sha256 of the first two is cited (recency-f-2026-10-02.json, the CLINC strip
# ruling); the third is declared the record of what was appended. Ignored rule by rule, only
# the rules each already breaks, per Fable's ruling on
# GAP-L-LINT-PINNED-FILES-KEEP-THE-GATE-RED-2026-10-02
# (AUDIT/post-f-2026-10-02/fable-v5-queue-readings-ruling.md). The gap's two oracle scripts
# under tools/ are NOT ignored: they are reformatted, and their fixtures regenerated, by a
# qd-train owner.
[tool.ruff.lint.per-file-ignores]
"AUDIT/post-f-2026-10-02/recency/recency_diagnostic.py" = ["E501", "I001"]
"AUDIT/prep2-2026-10-02/clinc_oracle.py" = ["E702", "B007"]
"AUDIT/post-f-2026-10-02/recency/append_gaps_recency.py" = ["E501"]
# The v5 finalize records (2026-10-03): the scripts that applied the v5 freeze and its two
# amendments, the dedupe probe, the H100 smoke and the pre-drop checks, kept as they ran. The
# same ruling, applied to new records on GAP-LINT-GATE-RED-ON-HEAD-154-FINDINGS-IN-18-
# COMMITTED-FILES-2026-10-06: rule by rule, only what each already breaks (ruff 0.16.8).
"AUDIT/finalize-2026-10-03/apply_v5_containment_scope_amendment.py" = ["E501"]
"AUDIT/finalize-2026-10-03/apply_v5_freeze.py" = ["E501", "E741", "B905", "UP031"]
"AUDIT/finalize-2026-10-03/apply_v5_launch_amendment.py" = ["E501"]
"AUDIT/finalize-2026-10-03/test_apply_v5_freeze.py" = ["E501", "B905", "RUF059", "UP031"]
"AUDIT/finalize-2026-10-03/dedupe-probe/candidates_by_family.py" = ["PTH123", "RUF100"]
"AUDIT/finalize-2026-10-03/dedupe-probe/pairs_look.py" = ["E501", "PTH123", "RUF100"]
"AUDIT/finalize-2026-10-03/dedupe-probe/probe.py" = ["E501", "PTH123", "RUF100"]
"AUDIT/finalize-2026-10-03/dedupe-probe/residual.py" = ["E501", "I001"]
"AUDIT/finalize-2026-10-03/dedupe-probe/residual_measure.py" = ["E501", "I001", "RUF100"]
"AUDIT/finalize-2026-10-03/h100-smoke/kernel_smoke.py" = ["E501", "B007"]
"AUDIT/finalize-2026-10-03/predrops/a7_missing_where.py" = ["E501", "I001"]
"AUDIT/finalize-2026-10-03/predrops/a7_pool_refusals.py" = ["I001"]
"AUDIT/finalize-2026-10-03/predrops/dryrun_drops.py" = ["I001"]
"AUDIT/finalize-2026-10-03/predrops/knockers.py" = ["I001"]
